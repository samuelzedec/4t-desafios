name: Health

services:
  database:
    image: postgres:18-alpine
    container_name: health-postgres
    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4tech
    ports:
      - "5432:5432"
    volumes:
      - volume-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: health-backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__PostgresConnection: Host=database;Database=health_db;Username=postgres;Password=4tech

networks:
  default:
    name: health-network

volumes:
  volume-data: